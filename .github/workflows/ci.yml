name: CI

# Push runs only for main; branches get CI through their pull request (and
# on demand). Before, a push to a PR branch ran everything twice: once for
# the push and once for the pull_request event, in different groups.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (or per ref for main/dispatch). Superseded PR runs are
  # cancelled: the ratchet stack (three QEMU targets, a toolchain download,
  # minutes of runner time) piled up once per push during baseline
  # harvests. Never on main, and never on the monorepo migration PR, whose
  # plan requires a complete run for every pushed commit.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'claude/sample-rate-expansion-strategies-ezqzu6' }}

env:
  CTEST_COMMON: --no-tests=error --output-on-failure

# One tree, three engines (async/, bridge/, rational/). Every job configures
# the ROOT once and builds every engine; a job that tests only one engine
# selects it at ctest time by label (async / bridge / rational, PLAN.md D16).
# Per-engine options keep each engine's own warning policy.
jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            async_werror: ON
            bridge_werror: ON
            rational_werror: ON
            capi: ON
          # The bridge engine's first Clang coverage on Linux.
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            async_werror: ON
            bridge_werror: ON
            rational_werror: ON
            capi: ON
          - name: macOS AppleClang
            os: macos-latest
            async_werror: ON
            bridge_werror: ON
            rational_werror: ON
            capi: ON
          # async's warnings stay non-fatal on MSVC until its /W4 output has
          # been triaged (async/docs/PERFORMANCE.md "Known debt"); bridge keeps
          # /WX, as RatioTap's CI did. The C ABI stays OFF: neither library
          # carries __declspec(dllexport), so an MSVC build would link DLLs
          # exporting nothing and gate nothing.
          - name: Windows MSVC
            os: windows-latest
            async_werror: OFF
            bridge_werror: ON
            rational_werror: ON
            capi: OFF
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTAP_SR_ASYNC_WERROR=${{ matrix.async_werror }}
          -DTAP_SR_BRIDGE_WERROR=${{ matrix.bridge_werror }}
          -DTAP_SR_RATIONAL_WERROR=${{ matrix.rational_werror }}
          -DTAP_SR_BUILD_CAPI=${{ matrix.capi }}

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release ${{ env.CTEST_COMMON }}

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
            labels: ""
          # TSan runs the async engine only: bridge is single-threaded, and
          # RatioTap never ran a TSan job.
          - name: TSan
            flags: -fsanitize=thread
            labels: -L ^async$
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # Each engine keeps its old sanitizer configuration: async without
      # WERROR and without examples, bridge with WERROR and its examples;
      # rational, new, with WERROR.
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTAP_SR_BUILD_EXAMPLES=OFF
          -DTAP_SR_BRIDGE_WERROR=ON
          -DTAP_SR_RATIONAL_WERROR=ON
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build ${{ env.CTEST_COMMON }} ${{ matrix.labels }}

  # Cross-compiled correctness under emulation, one job per (target, engine):
  # every engine is built in one tree and each job runs one engine's label
  # with that engine's own exclusions and parallelism, as each repository ran
  # them before (async serial, bridge -j 4 on Hexagon). The -V --output-log
  # file keeps every test's own output ([ RUN ] lines, [ measured ] numbers)
  # and is uploaded as evidence (monorepo gate G2).
  #   Hexagon (Linux/musl, qemu-hexagon user mode): 32-bit audio DSP, soft-
  #     float doubles. Excluded: the long quality/lock simulations and the
  #     thread stress (emulation neither speeds up nor measures them), and the
  #     EXPECT_THROW tests — this static-musl toolchain cannot unwind across
  #     frames, so a correct throw terminates (Known debt, PERFORMANCE.md).
  #   Cortex-M55 (MPS3 AN547) and Cortex-M33 (MPS2+ AN505, Pico 2 class):
  #     bare metal, newlib + semihosting, no threads, no FP64; each engine's
  #     one-shot binary bakes in its emulation-sized filter.
  qemu:
    name: ${{ matrix.title }} ${{ matrix.engine }} (QEMU)
    # Pinned image: toolchain and qemu packages must not move under a run.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: hexagon
            title: Hexagon cross
            engine: async
            label: async
            timeout: 45
            jobs: 1
            build_type: Release
            toolchain: cmake/hexagon-linux-musl.cmake
            exclude: AsrcQuality|AsrcLock|TwoThreadStress|TransparentPrototypeMeetsSpec|MultiChannel\.|Feasibility|Reset\.|ConfigValidation
          - target: hexagon
            title: Hexagon cross
            engine: bridge
            label: bridge
            timeout: 30
            jobs: 4
            build_type: Release
            toolchain: cmake/hexagon-linux-musl.cmake
            exclude: BadProfilesThrow|LatencyAndValidation
          # rational: every EXPECT_THROW test (named *Throw*) is excluded on
          # Hexagon for the unwind reason above, with the host measurements
          # (the coverage matrix's tone batteries, 182 chains in double per
          # profile, and the relaxation tables' searches, which run every
          # candidate length through the design grid: the 70 dB tables alone
          # exceed the job's budget under qemu-hexagon); on the Arm legs
          # bare_metal_main.cpp bakes in its own
          # filter (the fine-grid sweeps of the long designs and the
          # matrix suite).
          - target: hexagon
            title: Hexagon cross
            engine: rational
            label: rational
            timeout: 20
            jobs: 4
            build_type: Release
            toolchain: cmake/hexagon-linux-musl.cmake
            exclude: Throw|Matrix\.EveryRowMeets|RelaxationTablesAreTheSearch
          - target: m55
            title: Cortex-M55 cross
            engine: rational
            label: rational
            timeout: 20
            jobs: 1
            build_type: MinSizeRel
            toolchain: cmake/arm-cortex-m55-mps3.cmake
            exclude: ""
          - target: m33
            title: Cortex-M33 cross
            engine: rational
            label: rational
            timeout: 20
            jobs: 1
            build_type: MinSizeRel
            toolchain: cmake/arm-cortex-m33-mps2.cmake
            exclude: ""
          - target: m55
            title: Cortex-M55 cross
            engine: async
            label: async
            timeout: 30
            jobs: 1
            build_type: MinSizeRel
            toolchain: cmake/arm-cortex-m55-mps3.cmake
            exclude: ""
          - target: m55
            title: Cortex-M55 cross
            engine: bridge
            label: bridge
            timeout: 20
            jobs: 1
            build_type: MinSizeRel
            toolchain: cmake/arm-cortex-m55-mps3.cmake
            exclude: ""
          # ~23 min of emulated suite against a 40-minute budget.
          - target: m33
            title: Cortex-M33 cross
            engine: async
            label: async
            timeout: 40
            jobs: 1
            build_type: MinSizeRel
            toolchain: cmake/arm-cortex-m33-mps2.cmake
            exclude: ""
          - target: m33
            title: Cortex-M33 cross
            engine: bridge
            label: bridge
            timeout: 20
            jobs: 1
            build_type: MinSizeRel
            toolchain: cmake/arm-cortex-m33-mps2.cmake
            exclude: ""
    env:
      # Prebuilt open-source toolchain (BSD-3) published by Qualcomm/Quicinc;
      # binary artifacts are hosted on CodeLinaro and linked from the
      # quic/toolchain_for_hexagon release notes. Hard pin verified against
      # the published SHA256SUMS by scripts/fetch_hexagon_toolchain.sh.
      HEXAGON_TOOLCHAIN_URL: https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/19.1.5/clang+llvm-19.1.5-cross-hexagon-unknown-linux-musl.tar.zst
      HEXAGON_TOOLCHAIN_SHA256: "55b41922318f6331590ab7baa7f5dbdd99c109327a9c44a52c5e9878fab148c1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # The Arm toolchain is ~600 MB of .debs (libstdc++-arm-none-eabi-newlib
      # alone is 463 MB). A throttled apt mirror turned that into 40-minute
      # installs three times on 2026-09-30, cancelling jobs whose tests take
      # 27 min; cached .debs make the install an index refresh.
      - name: Runner image (for the package cache key)
        id: apt-image
        run: echo "os=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache the Arm toolchain packages
        if: matrix.target != 'hexagon'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/apt-archives
          key: apt-arm-toolchain-${{ steps.apt-image.outputs.os }}-1
      - name: Install Arm toolchain and QEMU
        if: matrix.target != 'hexagon'
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get update -q
          sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-archives" gcc-arm-none-eabi qemu-system-arm
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives && rm -rf ~/apt-archives/partial ~/apt-archives/lock

      - name: Cache Hexagon toolchain
        if: matrix.target == 'hexagon'
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/hexagon
          # Keyed on the pinned digest: every job that can write this key
          # verifies its download against the same pin (one shared script),
          # so no unverified writer can poison the trusted entry.
          key: hexagon-toolchain-${{ env.HEXAGON_TOOLCHAIN_SHA256 }}-1

      - name: Download Hexagon toolchain
        if: matrix.target == 'hexagon' && steps.cache.outputs.cache-hit != 'true'
        run: scripts/fetch_hexagon_toolchain.sh

      - name: Set up Hexagon toolchain and QEMU paths
        if: matrix.target == 'hexagon'
        run: |
          # No -type f (symlinks count); dirname of an empty find result is
          # ".", so assert on the find output itself.
          clangxx=$(find "$HOME/hexagon" -name 'hexagon-unknown-linux-musl-clang++' | head -1)
          test -n "$clangxx"
          echo "$(dirname "$clangxx")" >> "$GITHUB_PATH"
          # Prefer a qemu-hexagon bundled with the toolchain; else use distro qemu.
          qemu=$(find "$HOME/hexagon" -name 'qemu-hexagon' -type f | head -1 || true)
          if [ -n "$qemu" ]; then
            echo "$(dirname "$qemu")" >> "$GITHUB_PATH"
          else
            sudo apt-get update -q && sudo apt-get install -y -q qemu-user
          fi

      - name: Record image and toolchain versions
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          if [ "${{ matrix.target }}" = hexagon ]; then
            hexagon-unknown-linux-musl-clang++ --version
            qemu-hexagon --version
          else
            dpkg-query -W gcc-arm-none-eabi qemu-system-arm
          fi

      - name: Configure (every engine, one tree)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}
          -DTAP_SR_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Test under emulation (${{ matrix.engine }} only)
        shell: bash
        run: |
          args=(--test-dir build ${{ env.CTEST_COMMON }} -L '^${{ matrix.label }}$'
                -j ${{ matrix.jobs }} -V --output-log ctest-${{ matrix.target }}-${{ matrix.engine }}.log)
          if [ -n '${{ matrix.exclude }}' ]; then args+=(-E '${{ matrix.exclude }}'); fi
          ctest "${args[@]}"

      - name: Upload test log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctest-${{ matrix.target }}-${{ matrix.engine }}
          path: ctest-${{ matrix.target }}-${{ matrix.engine }}.log

  # ------------------------------------------------------------------------
  # Template: genuine Tensilica HiFi4/HiFi5 coverage. The HiFi audio ISA,
  # xt-clang compiler and xt-run instruction-set simulator are proprietary
  # (FlexLM-licensed Cadence tools), so this must run on a self-hosted
  # runner with access to the license server. Uncomment and adapt once such
  # a runner is registered (suggested labels: [self-hosted, cadence-xtensa]).
  #
  # hifi-iss:
  #   name: HiFi ISS (self-hosted)
  #   runs-on: [self-hosted, cadence-xtensa]
  #   env:
  #     XTENSA_CORE: <your HiFi core name>
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Configure
  #       run: >
  #         cmake -B build
  #         -DCMAKE_BUILD_TYPE=Release
  #         -DCMAKE_SYSTEM_NAME=Generic
  #         -DCMAKE_C_COMPILER=xt-clang
  #         -DCMAKE_CXX_COMPILER=xt-clang++
  #         "-DCMAKE_CROSSCOMPILING_EMULATOR=xt-run;--xtensa-core=$XTENSA_CORE"
  #         -DTAP_SR_BUILD_EXAMPLES=OFF
  #     - name: Build
  #       run: cmake --build build -j
  #     - name: Test on ISS
  #       run: >
  #         ctest --test-dir build --output-on-failure -L '^async$'
  #         -E 'AsrcQuality|AsrcLock|TwoThreadStress|TransparentPrototypeMeetsSpec'
  # ------------------------------------------------------------------------

  # Deterministic instruction-count ratchet (async/docs/PERFORMANCE.md,
  # bridge/PLAN.md section 7): fixed workloads under QEMU with a counting
  # plugin, gated two-sided at ±3% against each engine's
  # bench/baselines.json. Noise-free, so a hard gate is safe on shared
  # runners. One job per target measures both engines with the shared
  # harness (tools/qemu_insn_plugin, scripts/icount.py --engine); each
  # engine is still its own gated step, so one engine's regression never
  # hides the other's numbers.
  icount-ratchet:
    name: Instruction-count ratchet (${{ matrix.target }})
    # Pinned image: the counts are a function of the apt toolchain, the
    # plugin build and QEMU, so the job must not straddle an image rollout.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [m55, m33, hexagon]
    env:
      # Commit the v8.2.2 tag pointed at when pinned (tags are movable;
      # commit SHAs are not), with the header's digest verified on download.
      QEMU_PLUGIN_HEADER_URL: https://raw.githubusercontent.com/qemu/qemu/11aa0b1ff115b86160c4d37e7c37e6a6b13b77ea/include/qemu/qemu-plugin.h
      QEMU_PLUGIN_HEADER_SHA256: "c53a2af163e80e3f4bc6c60dbdfc84003db329d757e37cd8a16a77e1d82606ff"
      QEMU_SRC_URL: https://download.qemu.org/qemu-8.2.2.tar.xz
      # Hard pin from the "qemu source sha256:" line of run #24.
      QEMU_SRC_SHA256: "847346c1b82c1a54b2c38f6edbd85549edeb17430b7d4d3da12620e2962bc4f3"
      HEXAGON_TOOLCHAIN_URL: https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/19.1.5/clang+llvm-19.1.5-cross-hexagon-unknown-linux-musl.tar.zst
      # Same hard pin as the qemu job: this job also writes the shared
      # toolchain cache, so it verifies against the same digest.
      HEXAGON_TOOLCHAIN_SHA256: "55b41922318f6331590ab7baa7f5dbdd99c109327a9c44a52c5e9878fab148c1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # The Arm toolchain is ~600 MB of .debs (libstdc++-arm-none-eabi-newlib
      # alone is 463 MB). A throttled apt mirror turned that into 40-minute
      # installs three times on 2026-09-30, cancelling jobs whose tests take
      # 27 min; cached .debs make the install an index refresh.
      - name: Runner image (for the package cache key)
        id: apt-image
        run: echo "os=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache the Arm toolchain packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/apt-archives
          key: apt-arm-toolchain-${{ steps.apt-image.outputs.os }}-1
      - name: Install toolchains and QEMU
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get update -q
          sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-archives" gcc-arm-none-eabi qemu-system-arm libglib2.0-dev ninja-build meson flex bison
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives && rm -rf ~/apt-archives/partial ~/apt-archives/lock

      - name: Build counting plugin
        run: |
          curl -sfLo /tmp/qemu-plugin.h "$QEMU_PLUGIN_HEADER_URL"
          actual=$(sha256sum /tmp/qemu-plugin.h | cut -d' ' -f1)
          if [ "$actual" != "$QEMU_PLUGIN_HEADER_SHA256" ]; then
            echo "::error::qemu-plugin.h checksum mismatch"; exit 1
          fi
          gcc -shared -fPIC $(pkg-config --cflags glib-2.0) -I/tmp \
            -o /tmp/libinsncount.so tools/qemu_insn_plugin/insn_count.c

      # What produced the counts: the runner image and the toolchain packages
      # (the counts move when either does).
      - name: Record image and toolchain versions
        id: image
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          dpkg-query -W gcc-arm-none-eabi qemu-system-arm
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      # Neither Debian's nor the CodeLinaro toolchain's qemu-hexagon enables
      # TCG plugins, so the Hexagon leg builds its own from the pinned QEMU
      # release (linux-user target only, ~4 min, cached thereafter).
      - name: Cache plugin-enabled qemu-hexagon
        if: matrix.target == 'hexagon'
        id: qemu-hex
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/qemu-hexagon-plugins
          # The image OS is part of the key: the cached binary links the
          # image's glib, so a new Ubuntu release must not restore an old
          # build. (Weekly image updates keep the same glib ABI.)
          key: qemu-hexagon-plugins-${{ steps.image.outputs.os }}-${{ env.QEMU_SRC_URL }}-1

      - name: Build plugin-enabled qemu-hexagon
        if: matrix.target == 'hexagon' && steps.qemu-hex.outputs.cache-hit != 'true'
        run: |
          curl -sfLo /tmp/qemu-src.tar.xz "$QEMU_SRC_URL"
          actual=$(sha256sum /tmp/qemu-src.tar.xz | cut -d' ' -f1)
          echo "qemu source sha256: $actual (pin this in QEMU_SRC_SHA256)"
          if [ -n "${QEMU_SRC_SHA256:-}" ] && [ "$actual" != "$QEMU_SRC_SHA256" ]; then
            echo "::error::qemu source checksum mismatch"; exit 1
          fi
          tar -xJf /tmp/qemu-src.tar.xz -C /tmp
          cd /tmp/qemu-*/
          ./configure --target-list=hexagon-linux-user --enable-plugins \
            --disable-docs --disable-tools --disable-system
          ninja -C build qemu-hexagon
          mkdir -p ~/qemu-hexagon-plugins
          cp build/qemu-hexagon ~/qemu-hexagon-plugins/

      - name: Cache Hexagon toolchain
        if: matrix.target == 'hexagon'
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/hexagon
          key: hexagon-toolchain-${{ env.HEXAGON_TOOLCHAIN_SHA256 }}-1

      - name: Hexagon toolchain and plugin-enabled qemu on PATH
        if: matrix.target == 'hexagon'
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            scripts/fetch_hexagon_toolchain.sh
          fi
          # No -type f: the compiler may be a symlink in the restored tree.
          clangxx=$(find "$HOME/hexagon" -name 'hexagon-unknown-linux-musl-clang++' | head -1)
          if [ -z "$clangxx" ]; then
            echo "::error::hexagon cross compiler not found under ~/hexagon"
            exit 1
          fi
          test -x "$HOME/qemu-hexagon-plugins/qemu-hexagon" || {
            echo "::error::plugin-enabled qemu-hexagon missing"; exit 1; }
          # qemu exits 1 with or without plugin support here (no guest binary
          # was given), so probe by the error text, not the exit code.
          if "$HOME/qemu-hexagon-plugins/qemu-hexagon" -plugin help 2>&1 | grep -q "unknown option"; then
            echo "::error::built qemu-hexagon lacks plugin support"; exit 1
          fi
          # Each GITHUB_PATH line is prepended, so the last one wins: the
          # plugin-enabled qemu-hexagon must shadow any the toolchain bundles.
          echo "$(dirname "$clangxx")" >> "$GITHUB_PATH"
          echo "$HOME/qemu-hexagon-plugins" >> "$GITHUB_PATH"

      # Release (-O2), matching how the baselines were recorded; both engines'
      # workloads in one tree, tests and examples off.
      - name: Build workloads (both engines)
        run: |
          case "${{ matrix.target }}" in
            m55) tc=cmake/arm-cortex-m55-mps3.cmake ;;
            m33) tc=cmake/arm-cortex-m33-mps2.cmake ;;
            hexagon) tc=cmake/hexagon-linux-musl.cmake ;;
          esac
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$tc \
            -DTAP_SR_BUILD_TESTS=OFF -DTAP_SR_BUILD_EXAMPLES=OFF \
            -DTAP_SR_BUILD_ICOUNT_BENCH=ON
          cmake --build build -j 4

      - name: Ratchet async
        run: >
          python3 scripts/icount.py --engine async --target ${{ matrix.target }}
          --build-dir build --plugin /tmp/libinsncount.so

      # Runs even if async failed: each engine's numbers are independent
      # evidence. The job still fails if either step failed.
      - name: Ratchet bridge
        if: ${{ !cancelled() }}
        run: >
          python3 scripts/icount.py --engine bridge --target ${{ matrix.target }}
          --build-dir build --plugin /tmp/libinsncount.so

  # Each engine README's instruction-count table derives 1:1 from its
  # committed baselines; regenerating it must produce no diff.
  icount-docs:
    name: Icount docs freshness (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        engine: [async, bridge]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Docs freshness
        run: |
          python3 scripts/update_icount_docs.py --engine ${{ matrix.engine }}
          git diff --exit-code ${{ matrix.engine }}/README.md || {
            echo "::error::${{ matrix.engine }}/README.md icount table is stale; run scripts/update_icount_docs.py --engine ${{ matrix.engine }}"; exit 1; }

  # Keeps the benchmarks compiling and runnable; never a performance gate
  # (shared runners are noise — see async/docs/PERFORMANCE.md).
  bench-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTAP_SR_BUILD_BENCHMARKS=ON
          -DTAP_SR_BUILD_TESTS=OFF -DTAP_SR_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build -j 4

      - name: Run (smoke)
        run: ./build/async/bench/tap_sr_async_bench --benchmark_min_time=0.01s

  # Keeps the manually-triggered comparison paths (compare.yml,
  # async/bench/compare) compiling per push; build-only — the measured
  # numbers come from the manual workflow, never from here.
  compare-smoke:
    name: Comparison build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # Same cached Arm toolchain as the QEMU and Pico jobs (and the same
      # key): the uncached 463 MB newlib .deb hit the 20-minute timeout on
      # 2026-10-01 from the throttled mirror.
      - name: Runner image (for the package cache key)
        id: apt-image
        run: echo "os=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache the Arm toolchain packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/apt-archives
          key: apt-arm-toolchain-${{ steps.apt-image.outputs.os }}-1
      - name: Install dependencies
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get update -q
          sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-archives" libsamplerate0-dev libsoxr-dev gcc-arm-none-eabi
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives && rm -rf ~/apt-archives/partial ~/apt-archives/lock

      - name: Build host comparison bench
        run: >
          cmake -B build-host
          -DCMAKE_BUILD_TYPE=Release
          -DTAP_SR_BUILD_BENCHMARKS=ON
          -DTAP_SR_BUILD_COMPARE_BENCH=ON
          -DTAP_SR_BUILD_COMPARE_SHIM=ON
          -DTAP_SR_BUILD_TESTS=OFF -DTAP_SR_BUILD_EXAMPLES=OFF
          && cmake --build build-host -j 4 --target tap_sr_async_bench_compare tap_sr_async_r8b_shim

      - name: Build M55 comparison workload
        run: >
          cmake -B build-m55
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-cortex-m55-mps3.cmake
          -DTAP_SR_BUILD_TESTS=OFF -DTAP_SR_BUILD_EXAMPLES=OFF
          -DTAP_SR_BUILD_ICOUNT_BENCH=ON -DTAP_SR_ICOUNT_COMPARE=ON
          && cmake --build build-m55 -j 4 --target cmp_icount_lsr_medium
          cmp_icount_srt_q15 cmp_icount_r8b_120

  # The Pico 2 firmware examples are standalone projects (Pico SDK fetched at
  # configure time), deliberately outside the root build. Build-only; running
  # them needs the hardware (async/docs/HARDWARE_TESTING.md).
  pico2-build:
    name: Pico 2 firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # The Arm toolchain is ~600 MB of .debs (libstdc++-arm-none-eabi-newlib
      # alone is 463 MB). A throttled apt mirror turned that into 40-minute
      # installs three times on 2026-09-30, cancelling jobs whose tests take
      # 27 min; cached .debs make the install an index refresh.
      - name: Runner image (for the package cache key)
        id: apt-image
        run: echo "os=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache the Arm toolchain packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/apt-archives
          key: apt-arm-toolchain-${{ steps.apt-image.outputs.os }}-1
      - name: Install toolchain
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get update -q
          sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-archives" gcc-arm-none-eabi
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives && rm -rf ~/apt-archives/partial ~/apt-archives/lock

      - name: Build pico2_cyccnt
        run: >
          cmake -S async/examples/pico2_cyccnt -B build-cyccnt -DPICO_BOARD=pico2
          && cmake --build build-cyccnt -j 4

      - name: Build pico2_dualcore
        run: >
          cmake -S async/examples/pico2_dualcore -B build-dualcore -DPICO_BOARD=pico2
          && cmake --build build-dualcore -j 4

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      # Run the TapHouse pre-commit hook — the same pinned clang-format
      # developers get from `pre-commit install` (.pre-commit-config.yaml), so
      # local and CI share one version AND one file scope (all C/C++ minus
      # third_party) by construction. pipx is preinstalled on the runner.
      - name: Check formatting (pre-commit)
        run: |
          pipx install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  # The book (book/) quotes library code via mdBook anchor includes; this
  # gate makes a refactor that orphans an excerpt fail CI, the same
  # freshness contract as the README's generated tables. Warnings are
  # errors: a missing anchor is a warning, and a missing anchor is rot.
  book:
    name: Book build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MDBOOK_URL: https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
      MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install mdBook (pinned)
        run: |
          curl -sfLo /tmp/mdbook.tar.gz "$MDBOOK_URL"
          actual=$(sha256sum /tmp/mdbook.tar.gz | cut -d' ' -f1)
          if [ "$actual" != "$MDBOOK_SHA256" ]; then
            echo "::error::mdbook checksum mismatch"; exit 1
          fi
          tar -xzf /tmp/mdbook.tar.gz -C /tmp

      - name: Build (warnings are errors)
        run: |
          /tmp/mdbook build book 2>&1 | tee /tmp/book-build.log
          if grep -qiE 'warning|error' /tmp/book-build.log; then
            echo "::error::mdbook reported warnings/errors (stale anchor or broken include?)"
            exit 1
          fi

      # The API reference must build and be non-empty (both engines' headers
      # are its input); book-pages.yml publishes it from main.
      - name: API reference (Doxygen)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q doxygen graphviz
          doxygen docs/Doxyfile
          test -s docs/html/index.html || { echo "::error::Doxygen produced no index.html"; exit 1; }
          n=$(find docs/html -name '*.html' | wc -l)
          echo "doxygen: $n pages"
          [ "$n" -ge 20 ] || { echo "::error::Doxygen produced only $n pages"; exit 1; }

      # mdBook does not fail on a missing image, so check every relative
      # image reference resolves. (The SVGs are committed, generated by
      # scripts/book_figures.py; regeneration is not gated because
      # matplotlib's SVG output is not byte-stable across versions.)
      - name: Check image references resolve
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          src = pathlib.Path("book/src")
          missing = []
          for md in src.rglob("*.md"):
              for target in re.findall(r"!\[[^\]]*\]\(([^)#?]+)", md.read_text()):
                  if target.startswith(("http://", "https://")):
                      continue
                  if not (md.parent / target).resolve().exists():
                      missing.append(f"{md}: {target}")
          if missing:
              print("::error::broken image reference(s):")
              print("\n".join(missing))
              sys.exit(1)
          EOF
