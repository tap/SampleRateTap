name: Tap House Style

# Enforces the shared Tap House Rules. clang-format is checked in ci.yml (and
# locally by the pre-commit hook); this adds (1) a drift check against the
# canonical TapHouse configs and (2) clang-tidy naming + mandatory-braces
# enforcement over both engines' own translation units (scripts/tidy.sh is
# the local mirror). Same dedup scheme as ci.yml: PR branches run on
# pull_request events only, main runs on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'claude/sample-rate-expansion-strategies-ezqzu6' }}

jobs:
  drift:
    uses: tap/taphouse/.github/workflows/drift-check.yml@v5
    with:
      ref: v5

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18 cmake python3
      # Both engines with their tests and examples, plus the bridge engine's
      # icount workloads: the coverage each repository's gate had. The async
      # workloads (async/bench/icount) were never under this gate and do not
      # pass it yet; bringing them in is follow-up work, not a migration step.
      # Since step 3.4 the one family option builds both engines' workloads,
      # so the async ones are excluded below by path.
      - name: Configure (compile database)
        run: >
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DTAP_SR_BUILD_ICOUNT_BENCH=ON
      - name: clang-tidy (project TUs; the submodule, third_party, fetched deps and async/bench/icount excluded)
        run: |
          python3 -c "import json; print('\n'.join(e['file'] for e in json.load(open('build/compile_commands.json')) if 'submodules' not in e['file'] and 'third_party' not in e['file'] and '_deps' not in e['file'] and '/async/bench/icount/' not in e['file']))" > /tmp/tidy-files.txt
          # An empty list would pass silently.
          test -s /tmp/tidy-files.txt || { echo "::error::no translation units to check"; exit 1; }
          echo "checking $(wc -l < /tmp/tidy-files.txt) translation units"
          fail=0
          # Line-wise read, not word splitting: robust to paths with spaces.
          while IFS= read -r f; do
            out=$(clang-tidy-18 -p build "$f" 2>/dev/null || true)
            if echo "$out" | grep -qE "warning:|error:"; then echo "$out"; fail=1; fi
          done < /tmp/tidy-files.txt
          [ "$fail" -eq 0 ] && echo "clang-tidy clean." || { echo "::error::clang-tidy found violations"; exit 1; }
