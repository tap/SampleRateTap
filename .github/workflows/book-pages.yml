# Publishes the book (at /), its print edition (/SampleRateTap.pdf) and the
# Doxygen API reference (at /api/) to GitHub Pages on every push to main.
#
# The site is PUBLIC (https://tap.github.io/SampleRateTap/) even though the
# repository is private; it contains the book's code excerpts by design.
# One-time setup if the first run complains: Settings -> Pages -> Source:
# "GitHub Actions" (configure-pages below attempts to enable it itself).
name: book-pages

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "async/include/**"
      - "bridge/include/**"
      - "async/README.md"
      - "async/tests/**"
      - "async/capi/**"
      - "rational/include/**"
      - "submodules/dsptap"
      - "platform/**"
      - "tools/**"
      - "cmake/**"
      - ".github/workflows/book-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_URL: https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
  MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"
  PANDOC_URL: https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-linux-amd64.tar.gz
  PANDOC_SHA256: "5def6e1ff535e397becce292ee97767a947306150b9fb1488003b67ac3417c5e"
  TYPST_URL: https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
  TYPST_SHA256: "7d214bfeffc2e585dc422d1a09d2b144969421281e8c7f5d784b65fc69b5673f"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install Doxygen + Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Install mdBook (pinned)
        run: |
          curl -sfLo /tmp/mdbook.tar.gz "$MDBOOK_URL"
          actual=$(sha256sum /tmp/mdbook.tar.gz | cut -d' ' -f1)
          if [ "$actual" != "$MDBOOK_SHA256" ]; then
            echo "::error::mdbook checksum mismatch"; exit 1
          fi
          tar -xzf /tmp/mdbook.tar.gz -C /tmp

      - name: Build the book (warnings are errors)
        run: |
          /tmp/mdbook build book 2>&1 | tee /tmp/book-build.log
          if grep -qiE 'warning|error' /tmp/book-build.log; then
            echo "::error::mdbook reported warnings/errors"
            exit 1
          fi

      - name: Install pandoc + typst (pinned; the print edition)
        run: |
          curl -sfLo /tmp/pandoc.tar.gz "$PANDOC_URL"
          curl -sfLo /tmp/typst.tar.xz "$TYPST_URL"
          echo "$PANDOC_SHA256  /tmp/pandoc.tar.gz" | sha256sum -c - || { echo "::error::pandoc checksum mismatch"; exit 1; }
          echo "$TYPST_SHA256  /tmp/typst.tar.xz" | sha256sum -c - || { echo "::error::typst checksum mismatch"; exit 1; }
          tar -xzf /tmp/pandoc.tar.gz -C /tmp
          tar -xJf /tmp/typst.tar.xz -C /tmp

      - name: Build the print edition (PDF)
        run: |
          MDBOOK=/tmp/mdbook PANDOC=/tmp/pandoc-3.6.4/bin/pandoc TYPST=/tmp/typst-x86_64-unknown-linux-musl/typst \
            book/print/build.sh

      - name: Build the API reference
        run: doxygen docs/Doxyfile

      - name: Compose the Pages site (book at /, the PDF beside it, API at /api/)
        run: |
          mkdir -p site
          cp -r book/book/. site/
          cp book/print-build/SampleRateTap.pdf site/SampleRateTap.pdf
          mkdir -p site/api
          cp -r docs/html/. site/api/

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
