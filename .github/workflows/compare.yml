# Cross-resampler instruction-count comparison (each engine's
# docs/COMPARISON.md). Manual trigger only: competitor counts are measured
# once per toolchain/version pin and recorded, not gated — the ratchet
# (ci.yml) gates only our own code. One job per engine, in parallel
# (scripts/compare_binaries.sh <engine> lists its binaries). Every
# measurement is one "CMP_COUNT <target> <bin> <n>" line; the last step
# harvests them with their provenance into the engine's
# bench/compare_counts.json (scripts/harvest_compare.py), uploads the record
# as an artifact, and shows the doc diff it implies. Committing those files
# and the regenerated COMPARISON.md blocks is the manual half: ci.yml's
# compare-docs job keeps them in step from then on.
name: Resampler comparison (icount)

on:
  workflow_dispatch:

jobs:
  compare-icount:
    name: Comparison instruction counts (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [async, bridge, rational]
    env:
      # Commit the v8.2.2 tag pointed at when pinned (tags are movable;
      # commit SHAs are not), with the header's digest verified on download.
      QEMU_PLUGIN_HEADER_URL: https://raw.githubusercontent.com/qemu/qemu/11aa0b1ff115b86160c4d37e7c37e6a6b13b77ea/include/qemu/qemu-plugin.h
      QEMU_PLUGIN_HEADER_SHA256: "c53a2af163e80e3f4bc6c60dbdfc84003db329d757e37cd8a16a77e1d82606ff"
      QEMU_SRC_URL: https://download.qemu.org/qemu-8.2.2.tar.xz
      QEMU_SRC_SHA256: "847346c1b82c1a54b2c38f6edbd85549edeb17430b7d4d3da12620e2962bc4f3"
      HEXAGON_TOOLCHAIN_URL: https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/19.1.5/clang+llvm-19.1.5-cross-hexagon-unknown-linux-musl.tar.zst
      # Same hard pin as ci.yml's hexagon jobs: this job also writes the
      # shared toolchain cache, so it must verify against the same digest.
      HEXAGON_TOOLCHAIN_SHA256: "55b41922318f6331590ab7baa7f5dbdd99c109327a9c44a52c5e9878fab148c1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      # The Arm toolchain is ~600 MB of .debs; a throttled apt mirror turned
      # the install into 40-minute jobs on 2026-09-30 (see ci.yml). Cached
      # .debs make it an index refresh.
      - name: Runner image (for the package cache key)
        id: apt-image
        run: echo "os=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache the Arm toolchain packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/apt-archives
          key: apt-arm-toolchain-${{ steps.apt-image.outputs.os }}-1
      - name: Install toolchains and QEMU
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get update -q
          sudo apt-get install -y -q -o Dir::Cache::Archives="$HOME/apt-archives" gcc-arm-none-eabi qemu-system-arm libglib2.0-dev ninja-build meson flex bison
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives && rm -rf ~/apt-archives/partial ~/apt-archives/lock

      # What produced the counts: the runner image and the toolchain
      # packages (the counts move when either does). Harvested below.
      - name: Record image and toolchain versions
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          dpkg-query -W gcc-arm-none-eabi qemu-system-arm
          {
            echo -n "arm-none-eabi-gcc $(dpkg-query -W -f='${Version}' gcc-arm-none-eabi)"
            echo -n ", qemu-system-arm $(dpkg-query -W -f='${Version}' qemu-system-arm)"
            echo -n " (${ImageOS:-unknown} ${ImageVersion:-unknown})"
            echo ", hexagon-clang 19.1.5 and qemu-hexagon 8.2.2 at the pinned digests"
          } > /tmp/toolchains.txt

      - name: Build counting plugin
        run: |
          curl -sfLo /tmp/qemu-plugin.h "$QEMU_PLUGIN_HEADER_URL"
          actual=$(sha256sum /tmp/qemu-plugin.h | cut -d' ' -f1)
          if [ "$actual" != "$QEMU_PLUGIN_HEADER_SHA256" ]; then
            echo "::error::qemu-plugin.h checksum mismatch"; exit 1
          fi
          gcc -shared -fPIC $(pkg-config --cflags glib-2.0) -I/tmp \
            -o /tmp/libinsncount.so tools/qemu_insn_plugin/insn_count.c

      - name: Measure M55 and M33
        run: |
          for tgt in m55 m33; do
            if [ "$tgt" = m33 ]; then
              tc=cmake/arm-cortex-m33-mps2.cmake; machine=mps2-an505
            else
              tc=cmake/arm-cortex-m55-mps3.cmake; machine=mps3-an547
            fi
            cmake -B build-$tgt -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$tc \
              -DTAP_SR_BUILD_TESTS=OFF -DTAP_SR_BUILD_EXAMPLES=OFF \
              -DTAP_SR_BUILD_ICOUNT_BENCH=ON -DTAP_SR_ICOUNT_COMPARE=ON
            cmake --build build-$tgt -j 4
            # Each engine at 2 s and 4 s: the difference is steady state, the
            # remainder construction (async/bench/icount/cmp_main.cpp,
            # bridge/bench/icount/cmp_main.cpp).
            for bin in $(scripts/compare_binaries.sh ${{ matrix.engine }}); do
              out=$(qemu-system-arm -M $machine -nographic -semihosting \
                -d plugin -plugin /tmp/libinsncount.so \
                -kernel build-$tgt/$bin 2>&1)
              echo "$out" | grep -q 'ICOUNT_DONE ok=1' || {
                echo "$out"; echo "::error::$tgt $bin did not complete"; exit 1; }
              n=$(echo "$out" | grep -o 'TAP_SR_INSN_COUNT [0-9]*' | cut -d' ' -f2)
              echo "CMP_COUNT $tgt $(basename $bin) $n" | tee -a /tmp/cmp_counts.txt
            done
          done

      - name: Cache plugin-enabled qemu-hexagon
        id: qemu-hex
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/qemu-hexagon-plugins
          key: qemu-hexagon-plugins-${{ env.QEMU_SRC_URL }}-1

      - name: Build plugin-enabled qemu-hexagon
        if: steps.qemu-hex.outputs.cache-hit != 'true'
        run: |
          curl -sfLo /tmp/qemu-src.tar.xz "$QEMU_SRC_URL"
          actual=$(sha256sum /tmp/qemu-src.tar.xz | cut -d' ' -f1)
          if [ "$actual" != "$QEMU_SRC_SHA256" ]; then
            echo "::error::qemu source checksum mismatch"; exit 1
          fi
          tar -xJf /tmp/qemu-src.tar.xz -C /tmp
          cd /tmp/qemu-*/
          ./configure --target-list=hexagon-linux-user --enable-plugins \
            --disable-docs --disable-tools --disable-system
          ninja -C build qemu-hexagon
          mkdir -p ~/qemu-hexagon-plugins
          cp build/qemu-hexagon ~/qemu-hexagon-plugins/

      - name: Cache Hexagon toolchain
        id: cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/hexagon
          # Same digest-keyed name as ci.yml's hexagon jobs; the download
          # below verifies the same pin before anything is saved under it.
          key: hexagon-toolchain-${{ env.HEXAGON_TOOLCHAIN_SHA256 }}-1

      - name: Measure Hexagon
        run: |
          # The shared download+verify script, as every writer of the
          # digest-keyed cache uses.
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            scripts/fetch_hexagon_toolchain.sh
          fi
          clangxx=$(find "$HOME/hexagon" -name 'hexagon-unknown-linux-musl-clang++' | head -1)
          [ -n "$clangxx" ] || { echo "::error::hexagon compiler not found"; exit 1; }
          export PATH="$HOME/qemu-hexagon-plugins:$(dirname "$clangxx"):$PATH"
          cmake -B build-hex -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/hexagon-linux-musl.cmake \
            -DTAP_SR_BUILD_TESTS=OFF -DTAP_SR_BUILD_EXAMPLES=OFF \
            -DTAP_SR_BUILD_ICOUNT_BENCH=ON -DTAP_SR_ICOUNT_COMPARE=ON
          cmake --build build-hex -j 4
          for bin in $(scripts/compare_binaries.sh ${{ matrix.engine }}); do
            out=$(qemu-hexagon -d plugin -plugin /tmp/libinsncount.so \
              build-hex/$bin 2>&1)
            echo "$out" | grep -q 'ICOUNT_DONE ok=1' || {
              echo "$out"; echo "::error::hexagon $bin did not complete"; exit 1; }
            n=$(echo "$out" | grep -o 'TAP_SR_INSN_COUNT [0-9]*' | cut -d' ' -f2)
            echo "CMP_COUNT hexagon $(basename $bin) $n" | tee -a /tmp/cmp_counts.txt
          done

      # The record this engine's doc derives from, with what produced it
      # (the engine's binaries, selected by prefix). The diff printed here is
      # what committing the artifact would change; nothing fails on it, since
      # this job measures and the compare-docs job gates.
      - name: Harvest the counts with their provenance
        run: |
          case "${{ matrix.engine }}" in
            async) prefix=cmp_icount_ ;;
            bridge) prefix=cmp_bridge_icount_ ;;
            rational) prefix=cmp_rational_icount_ ;;
          esac
          python3 scripts/harvest_compare.py /tmp/cmp_counts.txt \
            --prefix "$prefix" --out "${{ matrix.engine }}/bench/compare_counts.json" \
            --sha "$GITHUB_SHA" \
            --dsptap "$(git -C submodules/dsptap rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --date "$(date -u +%Y-%m-%d)" \
            --toolchains "$(cat /tmp/toolchains.txt)"
          python3 scripts/update_compare_docs.py
          echo "::group::doc diff this run implies (commit ${{ matrix.engine }}/bench/compare_counts.json and ${{ matrix.engine }}/docs/COMPARISON.md to apply)"
          git --no-pager diff --stat -- '${{ matrix.engine }}/bench/compare_counts.json' '${{ matrix.engine }}/docs/COMPARISON.md'
          git --no-pager diff -- '${{ matrix.engine }}/docs/COMPARISON.md'
          echo "::endgroup::"
      - name: Upload the record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare_counts-${{ matrix.engine }}
          path: ${{ matrix.engine }}/bench/compare_counts.json
