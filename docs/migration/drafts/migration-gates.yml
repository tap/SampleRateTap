# DRAFT (audit round 2): the workflow v2's section 5 presupposes but never
# defines. Same-job A/B: step-0 trees (SampleRateTap@S0 and RatioTap@R0, both
# PUBLIC repositories, so no token is needed) and the gated SHA are built in
# ONE job with one toolchain. Lives only on the migration branch; deleted in
# step 4 with docs/migration/.
name: migration-gates
on:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: migration-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  S0: <SampleRateTap step-0 SHA>      # from docs/migration/tips.txt
  R0: <RatioTap step-0 SHA>
jobs:
  ab:
    name: A/B ${{ matrix.target }}
    runs-on: ubuntu-24.04            # pinned: G3/G4/G7 must not straddle an image rollout
    timeout-minutes: 90              # builds 3 trees; Hexagon A/B re-runs both suites' icount
    strategy:
      fail-fast: false
      matrix:
        target: [host, m33, m55, hexagon]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { submodules: recursive, path: new, fetch-depth: 1 }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with: { repository: tap/SampleRateTap, ref: "${{ env.S0 }}", submodules: recursive, path: old-async }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with: { repository: tap/RatioTap, ref: "${{ env.R0 }}", submodules: recursive, path: old-ratio }
      # 1. Same install step for all three (one toolchain).
      # 2. Build old-async, old-ratio, new with identical flags; export
      #    compile_commands.json (G7), ctest --show-only=json-v1 (G1),
      #    icount measurements to JSON (G3; compare new vs old MEASURED values
      #    with --exact, NOT new vs committed baselines), objdump of icount
      #    binaries (G4: restrict to icount binaries and library symbols; test
      #    binaries embed __FILE__ via gtest, and the moved paths shift .rodata),
      #    G5 hash tests, G6 lines.
      # 3. Diff; upload all artefacts; fail on any difference not in the
      #    committed allowlist (docs/migration/allow.txt, e.g. new bridge rows
      #    in Linux Clang and new async-label rows nowhere).
