name: Tap House Style

# Enforces the shared Tap House Rules. clang-format is run locally via the
# pre-commit hook; this adds (1) a drift check against the canonical TapHouse
# configs and (2) clang-tidy naming + mandatory-braces enforcement over this
# repo's own translation units (scripts/tidy.sh is the local mirror).
# Same dedup scheme as ci.yml: PR branches run on pull_request events only,
# main runs on push, superseded in-flight runs get cancelled per PR/ref.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    uses: tap/taphouse/.github/workflows/drift-check.yml@v5
    with:
      ref: v5

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18 cmake python3
      - name: Configure (compile database)
        run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTAP_RATIO_BUILD_TESTS=ON -DTAP_RATIO_BUILD_ICOUNT_BENCH=ON
      - name: clang-tidy (project TUs; the submodule and fetched deps excluded)
        run: |
          python3 -c "import json; print('\n'.join(e['file'] for e in json.load(open('build/compile_commands.json')) if 'submodules' not in e['file'] and 'third_party' not in e['file'] and '_deps' not in e['file']))" > /tmp/tidy-files.txt
          fail=0
          # Line-wise read, not word splitting: robust to paths with spaces.
          while IFS= read -r f; do
            out=$(clang-tidy-18 -p build "$f" 2>/dev/null || true)
            if echo "$out" | grep -qE "warning:|error:"; then echo "$out"; fail=1; fi
          done < /tmp/tidy-files.txt
          [ "$fail" -eq 0 ] && echo "clang-tidy clean." || { echo "::error::clang-tidy found violations"; exit 1; }
